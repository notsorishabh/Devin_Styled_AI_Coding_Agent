services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: devin
      POSTGRES_PASSWORD: devin
      POSTGRES_DB: devin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devin -d devin"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
